name: DB migrations

# Applicerar supabase/migrations mot moln-projektet vid push till main.
# Speglar Vercel-modellen: bara main, ingen preview. Trigga bara när migrationer
# faktiskt ändras. Secrets sätts i repo-inställningarna (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN  – personal access token (sbp_...)
#   SUPABASE_DB_PASSWORD   – databaslösenordet (satt när projektet skapades)
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

# Kör aldrig två migrationsjobb mot samma databas samtidigt.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: emtjnmyberugrkdplnsh
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link + push migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push
